<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>LandslideGuard AI Test</title>
</head>

<body>

    <h1>🌧️ LandslideGuard AI Prediction</h1>

    <button onclick="predictRisk()">Predict Risk</button>

    <h2 id="result">Waiting for prediction...</h2>

    <script>
        async function predictRisk() {

            const response = await fetch("/predict", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    rainfall: 100,
                    soil_moisture: 65,
                    slope: 30,
                    elevation: 1500,
                    historical_events: 4
                })
            });

            const data = await response.json();

            document.getElementById("result").innerHTML =
                "Risk: " + data.risk + "%<br>" +
                "Risk Level: " + data.risk_level;
        }
    </script>

</body>
</html>
